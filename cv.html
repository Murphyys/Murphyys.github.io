<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="CV of Bordin Pantdej (Ice): Wi-Fi indoor positioning research, publications, experience and projects.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bordin Pantdej | CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* A one-column paper CV. Screen: page on a tinted desk. Print: plain A4. */
:root{
  --desk:#ece6d6; --paper:#ffffff; --ink:#2b2620; --ink-soft:#5a5244; --line:#d8cfb6; --accent:#8a5a1e;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#12141c}}
:root[data-theme="dark"]{--desk:#12141c}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
.bar{max-width:820px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar a,.bar button{font-family:var(--f-mono);font-size:.78rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer}
.bar button{border-color:var(--accent);color:var(--accent)}
.bar button:hover{background:var(--accent);color:var(--paper)}
.paper{max-width:820px;margin:0 auto 48px;background:var(--paper);padding:48px 56px;border-radius:4px;box-shadow:0 10px 40px -20px rgba(40,30,10,.35)}
header h1{font-family:var(--f-display);font-weight:500;font-size:2.3rem;line-height:1.1;margin:0}
header .who{color:var(--ink-soft);margin-top:4px}
header .links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:.86rem}
.summary{margin-top:16px;color:var(--ink-soft);max-width:66ch}
section{margin-top:22px}
h2{font-family:var(--f-mono);font-weight:400;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.e{display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:6px 0;break-inside:avoid}
.e .t{font-weight:600}
.e .o{color:var(--ink-soft)}
.e .dt{font-family:var(--f-mono);font-size:.76rem;color:var(--ink-soft);white-space:nowrap;padding-top:2px;text-align:right}
.e .dl{grid-column:1/-1;font-size:.92rem;margin-top:2px}
.pub{padding:6px 0 6px 0;break-inside:avoid;font-size:.93rem}
.pub .st{font-family:var(--f-mono);font-size:.7rem;padding:1px 7px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);margin-left:6px;white-space:nowrap}
.pub .st.prep{border-color:#1f6f68;color:#1f6f68}
.proj{padding:4px 0;break-inside:avoid;font-size:.92rem}
.proj b{font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;font-size:.92rem}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0}
.foot{margin-top:28px;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-soft)}
@media (max-width:640px){
  .paper{padding:28px 18px;margin:0 0 24px;border-radius:0}
  .e{grid-template-columns:1fr}.e .dt{text-align:left;grid-row:auto}
  .kv{grid-template-columns:1fr;gap:0}.kv dd{margin-bottom:8px}
}
@page{size:A4;margin:14mm 16mm}
@media print{
  body{background:#fff;font-size:10.5pt}
  .bar{display:none}
  .paper{max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0}
  header h1{font-size:22pt}
  section{margin-top:14px}
  a{color:var(--ink);text-decoration:none}
  .print-url::after{content:" (" attr(href) ")";color:var(--ink-soft);font-size:.85em}
}
</style>
</head>
<body>
<div class="bar">
  <a href="./">← Back to portfolio</a>
  <button type="button" id="printBtn" title="Opens the print dialog. Choose “Save as PDF”.">Download PDF</button>
</div>

<main class="paper" id="cv">
  <p>Loading…</p>
</main>

<script>
fetch('journey.json', { cache: 'no-cache' }).then(r => r.json()).then(D => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const host = u => u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
  const P = D.profile, C = D.cv || {};
  // newest event first (events are stored oldest first); entries inside one event keep their order
  const entries = D.events.slice().reverse().flatMap(e => (e.cv || []).map(x => ({ ...x, id: e.id })));
  const by = s => entries.filter(x => x.section === s);
  const recent = list => list;

  const entry = x => `<div class="e"><div><span class="t">${esc(x.title)}</span>${x.org ? `<span class="o"> · ${esc(x.org)}${x.place ? `, ${esc(x.place)}` : ''}</span>` : ''}</div>
    <div class="dt">${esc(x.dates || '')}</div>${x.detail || x.link ? `<div class="dl">${esc(x.detail || '')}${x.link ? ` <a class="print-url" href="${esc(x.link)}">Code ↗</a>` : ''}</div>` : ''}</div>`;
  const section = (title, body) => body ? `<section><h2>${title}</h2>${body}</section>` : '';

  const links = [
    P.email && `<a href="mailto:${esc(P.email)}">${esc(P.email)}</a>`,
    `<a href="https://murphyys.github.io">murphyys.github.io</a>`,
    P.github && `<a href="${esc(P.github)}">${esc(host(P.github))}</a>`,
    P.linkedin && `<a href="${esc(P.linkedin)}">${esc(host(P.linkedin))}</a>`,
    P.orcid && `<a href="${esc(P.orcid)}">ORCID ${esc(host(P.orcid).replace('orcid.org/', ''))}</a>`,
    P.scholar && `<a href="${esc(P.scholar)}">Google Scholar</a>`
  ].filter(Boolean).join('');

  const pubs = recent(by('publication')).map(x => `<div class="pub">${esc(x.citation)}<span class="st ${/prep/i.test(x.status) ? 'prep' : ''}">${esc(x.status)}</span></div>`).join('');
  const projects = D.builds.map(b => `<div class="proj"><b>${esc(b.title)}</b>. ${esc((b.cvLine || b.desc.split('. ')[0]).replace(/\.$/, ''))}. <span style="color:var(--ink-soft)">${esc(b.tags.join(', '))}</span>${b.href ? ` <a class="print-url" href="${esc(b.href)}">Live ↗</a>` : ''}</div>`).join('');
  const kv = (C.skills || []).map(s => `<dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd>`).join('') + (C.languages ? `<dt>Languages</dt><dd>${esc(C.languages)}</dd>` : '');

  document.getElementById('cv').innerHTML = `
    <header>
      <h1>Bordin Pantdej</h1>
      <p class="who">Ice · Bangkok, Thailand</p>
      <div class="links">${links}</div>
      ${C.summary ? `<p class="summary">${esc(C.summary)}</p>` : ''}
    </header>
    ${section('Education', recent(by('education')).map(entry).join(''))}
    ${section('Research', recent(by('research')).map(entry).join(''))}
    ${section('Publications', pubs)}
    ${section('Experience', recent(by('experience')).map(entry).join(''))}
    ${section('Selected projects', projects)}
    ${section('Honors & certifications', recent(by('honor')).map(entry).join(''))}
    ${section('Skills & languages', kv && `<dl class="kv">${kv}</dl>`)}
    <p class="foot">Updated ${esc(C.updated || '')} · Full story: murphyys.github.io</p>`;
}).catch(err => { document.getElementById('cv').innerHTML = '<p>Could not load journey.json</p>'; console.error(err); });

document.getElementById('printBtn').addEventListener('click', () => window.print());
</script>
</body>
</html>
